name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare Release Asset
        id: prepare_asset
        if: success()
        run: |
          mkdir -p release-assets
          VERSION_TAG="${GITHUB_REF_NAME:-v1.0.${GITHUB_RUN_NUMBER}}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            VERSION_TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          ASSET_NAME="XML-${VERSION_TAG}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/${ASSET_NAME}"
          echo "tag_name=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "asset_path=release-assets/${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
        with:
          tag_name: ${{ steps.prepare_asset.outputs.tag_name }}
          name: Release ${{ steps.prepare_asset.outputs.tag_name }}
          files: ${{ steps.prepare_asset.outputs.asset_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
